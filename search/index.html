<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイト内検索 | 株式会社ブレイクスルーラボ（検証用）</title>
<style>
body{font-family:sans-serif;margin:0;color:#222;background:#fff}
header{background:#1d3557;color:#fff;padding:14px 20px;font-weight:bold}
main{max-width:820px;margin:0 auto;padding:24px 16px 60px}
form{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:6px}
button{padding:12px 22px;font-size:16px;background:#1d3557;color:#fff;border:0;border-radius:6px;cursor:pointer}
#status{color:#666;font-size:14px;margin:10px 0 18px}
.result{border-bottom:1px solid #e5e5e5;padding:14px 2px}
.result a{font-size:17px;color:#1d3557;font-weight:bold;text-decoration:none}
.result .url{font-size:12px;color:#888;margin:2px 0 6px;word-break:break-all}
.result .ex{font-size:14px;color:#444;line-height:1.7}
.result .ex mark{background:#fff3a6;padding:0 1px}
</style></head>
<body>
<header>株式会社ブレイクスルーラボ</header>
<main>
<h1 style="font-size:22px">サイト内検索</h1>
<form id="f"><input type="text" id="q" placeholder="検索ワード" aria-label="検索ワード"><button type="submit">検索</button></form>
<div id="status"></div>
<div id="results"></div>
</main>
<script type="module">
import * as pagefind from "../pagefind/pagefind.js";
const input = document.getElementById("q");
const status = document.getElementById("status");
const box = document.getElementById("results");
await pagefind.init();
async function run(q) {
  box.innerHTML = ""; status.textContent = q ? "検索中…" : "";
  if (!q) return;
  const s = await pagefind.search(q);
  status.textContent = "「" + q + "」の検索結果：" + s.results.length + "件";
  for (const r of s.results.slice(0, 20)) {
    const d = await r.data();
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = '<a></a><div class="url"></div><div class="ex"></div>';
    const a = div.querySelector("a");
    a.href = ".." + d.url; a.textContent = (d.meta && d.meta.title) || d.url;
    div.querySelector(".url").textContent = d.url;
    div.querySelector(".ex").innerHTML = d.excerpt || "";
    box.appendChild(div);
  }
}
const params = new URLSearchParams(location.search);
const initial = params.get("s") || params.get("q") || "";
input.value = initial;
if (initial) run(initial);
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  history.replaceState(null, "", "?s=" + encodeURIComponent(input.value));
  run(input.value.trim());
});
</script></body></html>
